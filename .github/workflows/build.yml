name: Build Dynamic Island EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract project archive
        shell: pwsh
        run: |
          $encoded = (Get-Content "source.zip.b64" -Raw).Trim()
          [IO.File]::WriteAllBytes("source.zip", [Convert]::FromBase64String($encoded))
          Expand-Archive -Path "source.zip" -DestinationPath "src" -Force

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish standalone EXE
        shell: pwsh
        run: |
          dotnet publish "src/DynamicIsland.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "publish"
          if (!(Test-Path "publish/DynamicIsland.exe")) { throw "EXE was not generated." }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-Windows-x64
          path: publish/DynamicIsland.exe
          if-no-files-found: error
