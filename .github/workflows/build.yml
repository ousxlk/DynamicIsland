name: Build windaynamic.exe + notifications

on:
  push:
    paths:
      - 'source/files2.zip.b64'
      - 'scripts/build-notifications.ps1'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build EXE and notification installer
        shell: pwsh
        run: ./scripts/build-notifications.ps1
      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: windaynamic-exe
          path: out/windaynamic.exe
      - name: Upload notification installer
        uses: actions/upload-artifact@v4
        with:
          name: windaynamic-notifications-installer
          path: out/windaynamic-notifications-installer.zip
