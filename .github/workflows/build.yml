name: Build windaynamic.exe

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish windaynamic.exe
        shell: pwsh
        run: |
          dotnet publish "DynamicIsland.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
          if (!(Test-Path "publish/windaynamic.exe")) { throw "windaynamic.exe was not generated." }

      - name: Upload windaynamic.exe
        uses: actions/upload-artifact@v4
        with:
          name: windaynamic
          path: publish/windaynamic.exe
          if-no-files-found: error
