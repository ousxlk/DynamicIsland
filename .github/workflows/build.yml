name: Build Dynamic Island EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish one self-installing Windows app
        shell: pwsh
        run: |
          dotnet publish "DynamicIsland.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
          if (!(Test-Path "publish/DynamicIsland.exe")) { throw "EXE was not generated." }

      - name: Upload single EXE
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-OneApp-Windows-x64
          path: publish/DynamicIsland.exe
          if-no-files-found: error
